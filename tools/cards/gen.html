<!-- Draws the share image (1200x630) and Apple Wallet thumbnail of every collector card; run by tools/cards/generate.mjs -->
<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="/assets/css/site.css">
<script type="module">
import { drawArt, setTheme, foil } from '/assets/js/join-card.js'; import { tierOf } from '/assets/js/join-pick.js'; import { COPY, CONFIG } from '/join/copy.js';
const T = COPY.en;
await document.fonts.load('600 40px Montserrat'); await document.fonts.load('italic 600 40px Montserrat');
const logo = new Image(); logo.src = '/assets/img/logo.svg'; await logo.decode();
let th, GOLD, A; // the card's rarity theme (join-card.js THEMES)
const bg = (g, w, h, cx, cy) => { const r = g.createRadialGradient(cx, cy, 20, cx, cy, Math.max(w, h) * 0.75); r.addColorStop(0, th.bg[0]); r.addColorStop(0.55, th.bg[1]); r.addColorStop(1, th.bg[2]); g.fillStyle = r; g.fillRect(0, 0, w, h); };
const out = {};
for (const lm of CONFIG.landmarks) {
  const tier = tierOf(lm); th = setTheme(tier); GOLD = th.accent; A = a => `rgba(${th.rgb},${a})`;
  // share image 1200 x 630
  const c = document.createElement('canvas'); c.width = 1200; c.height = 630; const g = c.getContext('2d');
  bg(g, 1200, 630, 330, 300);
  const glow = g.createRadialGradient(330, 300, 10, 330, 300, 260); glow.addColorStop(0, `rgba(${th.glow},0.3)`); glow.addColorStop(1, `rgba(${th.glow},0)`); g.fillStyle = glow; g.fillRect(0, 0, 640, 630);
  g.save(); g.translate(330 - 190, 70); g.scale(1.9, 1.9); g.fillStyle = GOLD; drawArt(g, lm); g.restore();
  g.strokeStyle = th.foil ? foil(g, 0, 0, 1200, 630) : A(0.6); g.lineWidth = th.foil ? 6 : 3; g.strokeRect(24, 24, 1152, 582);
  const cls = T.cardType[lm.cls], rar = T.cardRarity[tier], of = CONFIG.rarities[tier].pieces;
  g.drawImage(logo, 660, 92, 56, 56); g.fillStyle = th.light ? th.ink : GOLD; g.font = '600 24px Montserrat'; g.letterSpacing = '6px'; g.fillText('MYNTAS', 732, 130);
  g.font = '600 20px Montserrat'; g.letterSpacing = '4px'; g.fillStyle = A(0.85); g.fillText(`${cls} · ${rar}`.toUpperCase(), 660, 210);
  g.letterSpacing = '0px'; g.fillStyle = th.ink; g.font = '600 30px Montserrat'; g.fillText('Founding collector of', 660, 262);
  let size = 64; g.font = `600 ${size}px Montserrat`; while (g.measureText(lm.name).width > 480 && size > 36) { size -= 2; g.font = `600 ${size}px Montserrat`; }
  g.fillStyle = th.light ? th.ink : GOLD; g.font = `italic 600 ${size}px Montserrat`; g.fillText(lm.name, 660, 262 + size + 10);
  g.fillStyle = A(0.85); g.font = '500 22px Montserrat'; g.letterSpacing = '4px'; g.fillText(lm.city.toUpperCase(), 662, 262 + size + 52);
  g.letterSpacing = '0px'; g.fillStyle = th.ink; g.font = '500 24px Montserrat'; g.fillText('Get your own card at myntas.com/join', 660, 540);
  g.fillStyle = A(0.6); g.font = '400 15px Montserrat'; g.fillText('A collectible with no intrinsic value.', 660, 568); g.fillText('Not a share of any property.', 660, 590);
  // wallet thumbnail 180 x 180
  const t = document.createElement('canvas'); t.width = 180; t.height = 180; const k = t.getContext('2d');
  bg(k, 180, 180, 90, 90); k.save(); k.translate(90 - 75, 12); k.scale(0.75, 0.75); k.fillStyle = GOLD; drawArt(k, lm); k.restore();
  setTheme('common');
  out[lm.id] = { share: c.toDataURL('image/jpeg', 0.86), thumb: t.toDataURL('image/png') };
}
window.out = out;
</script>
